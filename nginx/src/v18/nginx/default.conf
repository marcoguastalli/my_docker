server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marco27.net;

    ssl_certificate /usr/share/nginx/certs/nginx-selfsigned.crt;
    ssl_certificate_key /usr/share/nginx/certs/nginx-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    charset utf-8;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    add_header  X-Robots-Tag "noindex, nofollow, nosnippet, noarchive";
    add_header  X-FROM "marco27.net";

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx","version":"1.31.2"}';
        add_header Content-Type application/json;
    }

    location / {
        # First attempt to serve request as file, then
        # as directory, then fall back to displaying a 404.
        try_files $uri $uri/ =404;
        root   /usr/share/nginx/html;
        index  index.html;
    }

    error_page  404 /404.html;
    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = / {
        root   /usr/share/nginx/html;
    }

}
