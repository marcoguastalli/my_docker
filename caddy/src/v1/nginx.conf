# ===========================
# nginx.conf for Docker Compose
# ===========================
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    aio             off;  # Disabled: Linux AIO not supported on Docker Desktop (macOS)
    tcp_nopush      on;   # Optimize for streaming
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    gzip  off;           # Disabled: Caddy handles compression upstream

    server {
        listen 81 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx","version":"1.26.3"}';
            add_header Content-Type application/json;
        }

        # Allow range requests for streaming
        # HLS / DASH friendly
        location / {
            try_files $uri $uri/ =404;
        }

        # Optional: increase client max body size if uploading files
        client_max_body_size 50M;

        # Optional: logging per request
        access_log /var/log/nginx/access.log main;
    }
}