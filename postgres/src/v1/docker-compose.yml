services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql:rw
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123four}
    networks:
      postgres-pgadmin:
        # Stable hostname other repos' shared-db override files connect to,
        # independent of this container's own name.
        aliases:
          - postgres-shared

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    restart: unless-stopped
    volumes:
      - ${PGADMIN_DATA_DIR:-./pgadmin-data}:/root/.pgadmin:rw
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123four}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - postgres-pgadmin

networks:
  postgres-pgadmin:
    # Explicit, stable name: other repos' docker-compose.shared-db.yml files
    # reference this network as `external: true`, so it can't be left to the
    # default project-directory-derived name.
    name: shared-postgres-net
